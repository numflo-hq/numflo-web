# Post-release verification and monthly re-scan of the live site (SDLC §7).
name: Production checks

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test numflo.com
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Wait until numflo.com serves this commit
        if: github.event_name == 'push'
        env:
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 40); do
            if curl -sf https://numflo.com/ | grep -q "name=\"numflo-build\" content=\"${SHA}\""; then echo "Deployed"; exit 0; fi
            sleep 15
          done
          echo "numflo.com did not serve commit ${SHA} within 10 minutes" && exit 1
      - run: node scripts/smoke.mjs https://numflo.com

  zap:
    name: Monthly ZAP scan of production
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://numflo.com
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: false
          cmd_options: "-a -j"
      - run: node scripts/check-zap.mjs report_json.json
