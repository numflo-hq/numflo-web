<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Inter;
        src: url("../src/assets/fonts/inter-latin.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: Inter;
        src: url("../src/assets/fonts/inter-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        unicode-range: U+0100-02BA, U+20A0-20C0;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        font-family: Inter, sans-serif;
        background: #0b7a63;
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .brand svg {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 80px;
        line-height: 1.05;
        margin: 0;
        font-weight: 800;
        letter-spacing: -0.03em;
        max-width: 900px;
      }
      p {
        font-size: 34px;
        margin: 24px 0 0;
        opacity: 0.9;
      }
      .wave {
        position: absolute;
        right: -40px;
        bottom: -30px;
        width: 620px;
        opacity: 0.18;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg viewBox="0 0 64 64">
        <rect width="64" height="64" rx="16" fill="#fff" />
        <path
          d="M12 42c6 0 8-8 14-8s8 8 14 8 8-20 12-26"
          fill="none"
          stroke="#0b7a63"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="52" cy="16" r="4.5" fill="#f4b25c" /></svg
      >numflo
    </div>
    <div>
      <h1 id="t"></h1>
      <p id="s"></p>
    </div>
    <svg class="wave" viewBox="0 0 64 64">
      <path
        d="M4 50c8 0 10-12 18-12s10 12 18 12 12-30 20-40"
        fill="none"
        stroke="#fff"
        stroke-width="5"
        stroke-linecap="round"
      />
    </svg>
    <script>
      const q = new URLSearchParams(location.search);
      document.getElementById("t").textContent = q.get("t");
      document.getElementById("s").textContent = q.get("s");
    </script>
  </body>
</html>
