# Automatic dependency update PRs (BRD Q-20). Every update PR runs the full CI gate.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    labels: [dependencies]
    ignore:
      # Major versions need a planned upgrade (breaking changes; CI blocked #5 and #6).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-astro"
        update-types: ["version-update:semver-major"]
      - dependency-name: "astro"
        update-types: ["version-update:semver-major"]
      # Playwright is pinned together with playwright-core (package.json overrides) and the
      # browser build it drives; it is upgraded manually in one change (CI blocked #4).
      - dependency-name: "@playwright/test"
      - dependency-name: "playwright-core"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
